name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Pinned, not ubuntu-latest: playwright 1.57 has no Ubuntu 26.04 build, so the
    # Chromium install below fails there. Revisit with a playwright >= 1.61 bump.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:run
      - name: Install Chromium for browser regression tests
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Test browser connection after long uptime
        if: matrix.node == 24
        run: A11YHAWK_BROWSER_TEST=1 npx vitest run src/engine/playwright.integration.test.ts
      - name: Test the Lighthouse-stage egress guard
        if: matrix.node == 24
        run: A11YHAWK_BROWSER_TEST=1 npx vitest run src/engine/lighthouse-egress.security.test.ts
      - run: npm run build
