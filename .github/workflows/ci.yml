name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Pinned, not ubuntu-latest: playwright 1.57 had no Ubuntu 26.04 build, so the
    # Chromium install below failed there. Playwright 1.61 added one, so moving to
    # ubuntu-latest is now possible. Make that move as its own change.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:run
      - name: Install Chromium for browser regression tests
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Let Chromium's sandbox create user namespaces
        # Ubuntu 23.10 and later block user namespaces for programs with no
        # AppArmor profile of their own, and Playwright's Chromium has none. The
        # sandbox is on since 0.8.0, so without this Chromium stops with
        # "No usable sandbox!". The runner is a throwaway VM.
        if: matrix.node == 24
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test browser connection after long uptime
        if: matrix.node == 24
        run: A11YHAWK_BROWSER_TEST=1 npx vitest run src/engine/playwright.integration.test.ts
      - name: Test the Lighthouse-stage egress guard
        if: matrix.node == 24
        run: A11YHAWK_BROWSER_TEST=1 npx vitest run src/engine/lighthouse-egress.security.test.ts
      - run: npm run build
